version: '3.8'

services:

  postgres:
    image: postgres:17  # Используем легковесную версию PostgreSQL
    container_name: postgres-db  # Имя контейнера
    environment:              # Переменные окружения для PostgreSQL
      - POSTGRES_DB=taskdb   # Имя базы данных
      - POSTGRES_USER=user   # Пользователь
      - POSTGRES_PASSWORD=password  # Пароль
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Том для хранения данных
    ports:
      - "5432:5432"         # Проброс порта PostgreSQL
    networks:
      - app-network         # Подключение к общей сети
    healthcheck:           # Проверка работоспособности
      test: ["CMD-SHELL", "pg_isready -U user -d taskdb"]  # Команда проверки
      interval: 10s        # Интервал проверки
      timeout: 5s         # Таймаут
      retries: 5         # Количество попыток

  # Конфигурация Kafka с использованием KRaft
  kafka:
    image: confluentinc/cp-kafka:7.5.16  # Последняя стабильная версия
    container_name: kafka   # Имя контейнера
    environment:
      # Основные настройки Kafka
      KAFKA_BROKER_ID: 1    # Уникальный идентификатор брокера

      # Настройки KRaft (замена ZooKeeper)
      KAFKA_NODE_ID: 1      # Идентификатор узла в KRaft
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'  # Конфигурация голосующих узлов
      KAFKA_PROCESS_ROLES: 'broker,controller'  # Роли процесса (брокер и контроллер)
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'  # Имя слушателя для контроллера

      # Настройки сетевых подключений
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092' # Точки подключения
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'  # Внешний адрес брокера
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'  # Протоколы
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'  # Слушатель для взаимодействия брокеров

      # Настройки репликации и транзакций
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # Фактор репликации для топика смещений
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0  # Задержка начального ребаланса
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1     # Минимальное число реплик для транзакций
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1  # Фактор репликации лога транзакций

      # Идентификация кластера KRaft
      KAFKA_CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw  # ID кластера
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw        # Дублирующий ID для совместимости
    ports:
      - "9092:9092"     # Проброс порта Kafka
      - "29092:29092"
    networks:
      - app-network     # Подключение к общей сети
    volumes:
      - kafka-data:/var/lib/kafka/data  # Том для хранения данных
    healthcheck:        # Проверка работоспособности
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s     # Интервал проверки
      timeout: 10s      # Таймаут
      retries: 3        # Количество попыток

  # Веб-интерфейс для управления Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest  # Последняя версия UI
    container_name: kafka-ui-dev  # Имя контейнера
    depends_on:
      - kafka                # Зависимость от Kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local  # Имя кластера в UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092  # Адрес подключения
    ports:
      - "8090:8080"         # Проброс порта UI
    networks:
      - app-network         # Подключение к общей сети

# Определение томов для постоянного хранения
volumes:
  postgres-data:    # Том для PostgreSQL
  kafka-data:       # Том для Kafka

# Определение сети для коммуникации сервисов
networks:
  app-network:      # Общая сеть для всех сервисов
    driver: bridge  # Использование bridge-драйвера