spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: user
    password: password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      register-mbeans: true
      pool-name: TaskServicePool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: task-group

worker:
  pool:
    size: 4
  poll-delay-ms: 1000

lease:
  timeout:
    seconds: 30

kafka:
  topic: tasks
  listener:
    concurrency: 1

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never