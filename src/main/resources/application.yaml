spring:
  application:
    name: highload-async-service
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: user
    password: password
    hikari:
      # Основные настройки пула
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000  # 5 минут
      connection-timeout: 20000  # 20 секунд
      max-lifetime: 1200000  # 20 минут

      # Настройки производительности
      auto-commit: false
      validation-timeout: 5000
      leak-detection-threshold: 60000

      # Настройки для оптимистичной блокировки
      transaction-isolation: TRANSACTION_READ_COMMITTED

      # Метрики и мониторинг
      register-mbeans: true
      metrics-tracker-enabled: true
      pool-name: TaskServicePool

server:
  port: 8040

kafka:
  bootstrap-servers: 9092

worker:
  pool:
    size: 36

logging:
  level:
    org.hibernate.SQL: DEBUG
